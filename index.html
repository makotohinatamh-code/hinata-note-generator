<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>日向真 — note記事ジェネレーター</title>
<style>
:root{--bg:#0d1117;--sf:#161b22;--s2:#21262d;--s3:#2d333b;--bd:#30363d;--acc:#58a6ff;--acc2:#bc8cff;--acc3:#34d399;--text:#e6edf3;--mut:#8b949e;--ok:#3fb950;--ng:#f85149;--warn:#d29922;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;padding-bottom:80px}
.header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:0;z-index:100}
.header h1{font-size:15px;font-weight:600}
.header p{font-size:11px;color:var(--mut);margin-top:2px}
.tabs-bar{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;position:sticky;top:52px;z-index:99}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:10px 14px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent}
.tab-btn.on{color:var(--acc);border-bottom-color:var(--acc)}
.tp{display:none;padding:12px 16px}.tp.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--text);width:100%;margin-bottom:6px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#000}
.btn-free{background:#1a3a1a;border-color:#2d6a2d;color:#4caf82}
.btn-paid{background:#2d1f3d;border-color:#5a3d8a;color:#bc8cff}
.btn-scenario{background:#2d2200;border-color:#6a5000;color:#d29922}
.btn-copy{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--mut)}
.btn-copy.ok{color:var(--ok);border-color:var(--ok)}
textarea{width:100%;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--text);font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;outline:none;min-height:120px}
.ni{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
.ni.sel{border-color:var(--acc2);background:rgba(188,140,255,.06)}
.ni-chk{width:16px;height:16px;accent-color:var(--acc2);margin-right:6px;flex-shrink:0}
.sbadge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.s-hi{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
.s-md{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.3)}
.s-lo{background:rgba(248,81,73,.1);color:var(--ng);border:1px solid rgba(248,81,73,.25)}
.mtag{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:600}
.mtag-boj{background:rgba(88,166,255,.12);color:var(--acc);border:1px solid rgba(88,166,255,.25)}
.mtag-fx{background:rgba(52,211,153,.12);color:var(--acc3);border:1px solid rgba(52,211,153,.25)}
.mtag-market{background:rgba(188,140,255,.12);color:var(--acc2);border:1px solid rgba(188,140,255,.25)}
.mtag-global{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid rgba(210,153,34,.25)}
.mtag-basic{background:rgba(63,185,80,.1);color:var(--ok);border:1px solid rgba(63,185,80,.25)}
.st{padding:14px;text-align:center;color:var(--mut);font-size:13px;background:var(--s2);border-radius:8px;border:1px solid var(--bd)}
.st.load{color:var(--acc)}.st.err{color:var(--ng);border-color:rgba(248,81,73,.3)}
.otabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;margin-bottom:10px}
.otabs::-webkit-scrollbar{display:none}
.otab{padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--mut);white-space:nowrap;flex-shrink:0}
.otab.on{background:var(--s2);color:var(--text);border-color:var(--acc)}
.op{display:none}.op.on{display:block}
.title-box{background:var(--s2);border:1px solid var(--acc2);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.tweet-card{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.tweet-header{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tweet-label{font-size:12px;font-weight:600;color:var(--acc)}
.tweet-body{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.url-box{background:var(--s3);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.rev-panel{background:var(--s2);border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd)}
.rev-header{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.rev-verdict{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.v-ok{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
.v-warn{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.3)}
.v-ng{background:rgba(248,81,73,.1);color:var(--ng);border:1px solid rgba(248,81,73,.25)}
.rev-item{font-size:12px;padding:2px 0;line-height:1.5}
.ai-issue{background:rgba(248,81,73,.06);border:1px solid rgba(248,81,73,.2);border-radius:6px;padding:7px 9px;margin:4px 0;font-size:12px}
.mag-box{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.paid-rec{background:linear-gradient(135deg,rgba(188,140,255,.08),rgba(88,166,255,.08));border:1px solid var(--acc2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ev-bar{padding:8px 12px;border-radius:8px;border:1px solid;margin-bottom:6px;font-size:12px}
.ev-today{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.4);color:var(--ng)}
.ev-soon{background:rgba(210,153,34,.08);border-color:rgba(210,153,34,.35);color:var(--warn)}
.ev-coming{background:rgba(88,166,255,.06);border-color:rgba(88,166,255,.2);color:var(--acc)}
.ev-days{font-size:10px;padding:1px 7px;border-radius:12px;font-weight:700;display:inline-block;margin-left:4px}
.ev-days-today{background:rgba(248,81,73,.2);color:var(--ng)}
.ev-days-soon{background:rgba(210,153,34,.15);color:var(--warn)}
.ev-days-coming{background:rgba(88,166,255,.12);color:var(--acc)}
.hitem{padding:10px 12px;background:var(--s2);border-radius:8px;border:1px solid var(--bd);margin-bottom:6px;cursor:pointer}
.hitem.active{border-color:var(--acc2)}
.hdate{font-size:11px;color:var(--mut);margin-bottom:3px;display:flex;gap:5px;flex-wrap:wrap}
.htitle{font-size:13px;font-weight:500;margin-bottom:2px}
.hpreview{font-size:11px;color:var(--mut)}
.detail-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.detail-hd{padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--bd)}
.detail-body{padding:12px 14px}
.mode-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.mode-free{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
.mode-paid{background:rgba(188,140,255,.15);color:var(--acc2);border:1px solid rgba(188,140,255,.3)}
.mode-scenario{background:rgba(210,153,34,.15);color:var(--warn);border:1px solid rgba(210,153,34,.3)}
.fbar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}
.fbar::-webkit-scrollbar{display:none}
.fchip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--mut);white-space:nowrap;flex-shrink:0}
.fchip.on{background:var(--s2);color:var(--text);border-color:var(--acc)}
.gen-box{background:var(--s3);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.7;color:var(--mut)}
.gen-box a{color:var(--acc)}
hr{border:none;border-top:1px solid var(--bd);margin:10px 0}
input[type=url]{width:100%;padding:9px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:6px}
input[type=url]:focus{border-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center}.sp{flex:1}
</style>
</head>
<body>
<div class="header">
  <h1>📊 日向真 — note記事ジェネレーター</h1>
  <p id="statusText">読み込み中...</p>
</div>
<div class="tabs-bar">
  <button class="tab-btn on" onclick="tab('news',this)">📡 ニュース</button>
  <button class="tab-btn" onclick="tab('result',this)">✨ 生成結果</button>
  <button class="tab-btn" onclick="tab('archive',this)">🗃️ アーカイブ</button>
  <button class="tab-btn" onclick="tab('events',this)">🗓️ イベント</button>
</div>

<!-- ニュース -->
<div class="tp on" id="tp-news">
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <span class="card-title" style="margin-bottom:0">ニュース一覧</span>
      <div class="sp"></div>
      <span id="newsAge" style="font-size:11px;color:var(--mut)"></span>
    </div>
    <button id="rssFetchBtn" class="btn btn-primary" onclick="fetchRSSNow()" style="margin-bottom:8px">📡 今すぐ最新ニュースを取得</button>
    <div class="fbar">
      <button class="fchip on" onclick="filt('all',this)">すべて</button>
      <button class="fchip" onclick="filt('hi',this)">🟢 高(7〜)</button>
      <button class="fchip" onclick="filt('md',this)">🟡 中(4〜6)</button>
      <button class="fchip" onclick="filt('lo',this)">🔴 低(〜3)</button>
      <button class="fchip" onclick="filt('boj',this)">🏛️</button>
      <button class="fchip" onclick="filt('fx',this)">🌐</button>
      <button class="fchip" onclick="filt('market',this)">📊</button>
      <button class="fchip" onclick="filt('global',this)">🌏</button>
    </div>
    <div id="newsList"><div class="st load">ニュースを読み込み中...</div></div>
  </div>
  <div id="selBar" style="display:none" class="card">
    <div class="row" style="margin-bottom:8px">
      <span id="selCount" style="font-size:12px;color:var(--mut)">0件選択中</span>
      <div class="sp"></div>
      <button class="btn-copy" onclick="clearSel()">選択解除</button>
    </div>

    <button class="btn btn-free" onclick="triggerGenerate('free')">✅ 無料記事として生成</button>
    <button class="btn btn-paid" onclick="triggerGenerate('paid')">💎 有料・深掘りで生成</button>
    <button class="btn btn-scenario" onclick="triggerGenerate('scenario')">⚡ シナリオ分析で生成</button>
  </div>
</div>

<!-- 生成結果 -->
<div class="tp" id="tp-result">
  <div id="resultArea"><div class="st">生成結果はここに表示されます<br><span style="font-size:11px">GitHub Actionsで生成後、リロードすると表示されます</span></div></div>
  <div style="text-align:center;margin-top:8px">
    <button class="btn" style="width:auto;padding:8px 20px" onclick="loadResult()">🔄 最新の生成結果を読み込む</button>
  </div>
</div>

<!-- アーカイブ -->
<div class="tp" id="tp-archive">
  <div class="card">
    <div class="card-title">🗃️ 生成済み記事アーカイブ</div>
    <div id="archList"><div class="st">読み込み中...</div></div>
  </div>
  <div id="archDetail" style="display:none"></div>
</div>

<!-- イベント -->
<div class="tp" id="tp-events">
  <div class="card">
    <div class="card-title">🗓️ 重要経済イベント</div>
    <div id="eventList"><div class="st load">読み込み中...</div></div>
  </div>
</div>

<script>
const REPO_OWNER = 'makotohinatamh-code';
const REPO_NAME  = 'hinata-note-generator';
const RAW_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main`;
const ACTIONS_URL = `https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/workflows/article.yml`;
const PROXY_URL   = 'https://hinata-proxy.makoto-hinata-mh.workers.dev';
const DAYS = ['日','月','火','水','木','金','土'];
const MAG = {
  boj:{cls:'mtag-boj',name:'🏛️ 日銀'},fx:{cls:'mtag-fx',name:'🌐 為替'},
  market:{cls:'mtag-market',name:'📊 マーケット'},global:{cls:'mtag-global',name:'🌏 海外'},basic:{cls:'mtag-basic',name:'💡 基礎'}
};
const ML = {free:'無料',paid:'有料💎',scenario:'シナリオ⚡'};

let allNews=[], filteredNews=[], selected=new Set(), archAll=[], activeArchIdx=-1;

function tab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tp').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on'); document.getElementById('tp-'+name).classList.add('on');
  if(name==='archive') loadArchive();
  if(name==='events')  renderEvents();
  if(name==='result')  loadResult();
}
function otab(name,btn,gid){
  document.querySelectorAll(`#${gid} .otab`).forEach(t=>t.classList.remove('on'));
  document.querySelectorAll(`#${gid} .op`).forEach(p=>p.classList.remove('on'));
  btn.classList.add('on'); document.getElementById('op-'+name).classList.add('on');
}

// ── ニュース読み込み（GitHub保存済みJSON） ──
async function loadNews(){
  try{
    const r=await fetch(`${RAW_BASE}/scored_news.json?t=${Date.now()}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    allNews=d.items||[]; filteredNews=[...allNews];
    document.getElementById('newsAge').textContent=`更新: ${d.generated_at||''}`;
    document.getElementById('statusText').textContent=`✅ ニュース${allNews.length}件 | 毎朝7時自動更新`;
    renderNews();
  }catch(e){
    document.getElementById('newsList').innerHTML=`<div class="st err">ニュースの読み込みに失敗しました<br><span style="font-size:11px">${e.message}</span></div>`;
    document.getElementById('statusText').textContent='⚠️ ニュース読み込み失敗';
  }
}

// ── 手動RSS取得（Cloudflare Workers経由） ──
async function fetchRSSNow(){
  const btn=document.getElementById('rssFetchBtn');
  btn.disabled=true; btn.textContent='📡 取得中...';
  document.getElementById('newsList').innerHTML='<div class="st load">📡 最新ニュースを取得中... (20〜40秒)</div>';
  document.getElementById('selBar').style.display='none';
  selected.clear();
  try{
    // Step1: RSS取得
    const r=await fetch(`${PROXY_URL}/rss?t=${Date.now()}`);
    if(!r.ok) throw new Error(`RSS取得失敗: HTTP ${r.status}`);
    const d=await r.json();
    const rawItems=d.items||[];
    if(!rawItems.length) throw new Error('ニュースが取得できませんでした');

    document.getElementById('newsList').innerHTML=`<div class="st load">🤖 ${rawItems.length}件をスコアリング中... (30〜60秒)</div>`;

    // Step2: Haikuでスコアリング（5件ずつ並列）
    const scored=[];
    const CHUNK=5;
    for(let i=0;i<rawItems.length;i+=CHUNK){
      const chunk=rawItems.slice(i,i+CHUNK);
      const results=await Promise.all(chunk.map(item=>scoreItem(item)));
      scored.push(...results);
      const pct=Math.min(Math.round((i+CHUNK)/rawItems.length*100),99);
      document.getElementById('newsList').innerHTML=`<div class="st load">🤖 スコアリング中... ${i+CHUNK}/${rawItems.length}件 (${pct}%)</div>`;
    }

    scored.sort((a,b)=>(b.total||0)-(a.total||0));
    allNews=scored; filteredNews=[...scored];
    document.getElementById('newsAge').textContent=`手動取得: ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('statusText').textContent=`✅ 最新ニュース${scored.length}件を取得しました`;
    renderNews();
  }catch(e){
    document.getElementById('newsList').innerHTML=`<div class="st err">エラー: ${esc(e.message)}</div>`;
    document.getElementById('statusText').textContent='⚠️ RSS取得失敗';
  }
  btn.disabled=false; btn.textContent='📡 今すぐ取得';
}

const SCORE_PROMPT=`ニュース記事を5軸で各10点満点（計50点）でスコアリングしてください。英語記事でも日本語で評価してください。
A.注目度 B.先進性 C.意外性 D.著者適合性（経済・金融・為替・日銀） E.読者価値
最適なマガジンも選択：boj/fx/market/global/basic
JSONのみ回答：{"A":X,"B":X,"C":X,"D":X,"E":X,"total":X,"reason":"30字以内","magazine":"id"}`;

async function scoreItem(item){
  try{
    const prefix=item.lang==='en'?'[EN] ':'';
    const raw=await callClaude(SCORE_PROMPT,`${prefix}Title: ${item.title}\nSummary: ${item.desc||''}`,150);
    const m=raw.match(/\{[\s\S]*?\}/);
    if(m){
      const d=JSON.parse(m[0]);
      if(!d.total) d.total=((d.A||0)+(d.B||0)+(d.C||0)+(d.D||0)+(d.E||0));
      return {...item,scoreData:d,total:parseInt(d.total)||0,reason:d.reason||'',magazine_tag:d.magazine||'market'};
    }
  }catch(e){}
  return {...item,scoreData:{},total:0,reason:'',magazine_tag:'market'};
}

function renderNews(){
  const el=document.getElementById('newsList');
  if(!filteredNews.length){el.innerHTML='<div class="st">該当ニュースなし</div>';return;}
  el.innerHTML=filteredNews.map(item=>{
    const idx=allNews.indexOf(item);
    const sel=selected.has(idx);
    const avg=((item.total||0)/5).toFixed(1);
    const cls=avg>=7?'s-hi':avg>=4?'s-md':'s-lo';
    const mag=item.magazine_tag||'market';
    const mi=MAG[mag]||MAG.market;
    const en=item.lang==='en'?'<span style="font-size:10px;padding:1px 5px;border-radius:6px;background:rgba(210,153,34,.1);color:var(--warn)">EN</span>':'';
    return `<div class="ni${sel?' sel':''}" onclick="selItem(${idx})">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <input type="checkbox" class="ni-chk" ${sel?'checked':''} onclick="event.stopPropagation();selItem(${idx})">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;line-height:1.4;margin-bottom:4px">${esc(item.title)}</div>
          <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            <span class="sbadge ${cls}">★ ${avg}/10</span>
            <span class="mtag ${mi.cls}">${mi.name}</span>
            ${en}<span style="font-size:10px;color:var(--mut)">${item.pubDate||''}</span>
            ${item.reason?`<span style="font-size:10px;color:var(--mut);font-style:italic">${esc(item.reason)}</span>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  updSel();
}

function filt(type,btn){
  document.querySelectorAll('.fbar .fchip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  const mags=['boj','fx','market','global','basic'];
  filteredNews=allNews.filter(item=>{
    const avg=(item.total||0)/5;
    if(type==='hi') return avg>=7;
    if(type==='md') return avg>=4&&avg<7;
    if(type==='lo') return avg<4;
    if(mags.includes(type)) return (item.magazine_tag||'market')===type;
    return true;
  });
  renderNews();
}

function selItem(idx){
  selected.has(idx)?selected.delete(idx):selected.add(idx);
  renderNews();
}
function clearSel(){selected.clear();renderNews();}
function updSel(){
  const n=selected.size;
  document.getElementById('selCount').textContent=`${n}件選択中`;
  document.getElementById('selBar').style.display=n>0?'block':'none';
}

// ── ペルソナプロンプト ──
const PERSONA_BASE=`あなたは「日向真（ひなた まこと）」として記事を書きます。
34歳・男性・横浜在住。元大手証券会社 株式ディーリング部（デスクトレーダー6年）。育休中（第一子1歳6ヶ月）。
一人称「私」。です・ます調。口語的・テンポ速い。短文多用。
絵文字は📊 📌 💡 🏛️ 🌐 📉 📈 🔍 ⚡ 🗓️ のみ。読者「みなさん」または「忙しいみなさん」。

// ── Claude API（Cloudflare Workers経由） ──
async function callClaude(system, user, maxTokens=4000){
  const r=await fetch(PROXY_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens,system,messages:[{role:'user',content:user}]})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  return d.content[0].text;
}

function parseJson(raw){
  try{const m=raw.match(/\{[\s\S]*?\}/);if(m)return JSON.parse(m[0]);}catch(e){}return {};
}

function calcX(text){
  let t=text.replace(/https?:\/\/[^\s]*/g,'_'.repeat(23));
  let c=0;for(const ch of t){c+=ch.codePointAt(0)>0xFFFF?2:1;}return c;
}

// ── 日時コンテキスト ──
function buildDtContext(items){
  const now=new Date();
  const nowJst=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  const today=new Date(nowJst.getFullYear(),nowJst.getMonth(),nowJst.getDate());
  return items.map((item,i)=>{
    const pub=item.pub_dt||item.pubDate||'';
    if(!pub) return `【${i+1}】${item.title.substring(0,40)} → 配信日時不明`;
    try{
      const pd=new Date(pub);
      const pjst=new Date(pd.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
      const pdate=new Date(pjst.getFullYear(),pjst.getMonth(),pjst.getDate());
      const diff=Math.round((today-pdate)/86400000);
      const ptime=pjst.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      const pmd=`${pjst.getMonth()+1}/${pjst.getDate()}`;
      let rel=diff===0?`今日(${ptime}配信)`:diff===1?`昨日(${pmd} ${ptime}配信)`:diff<=3?`${diff}日前(${pmd}配信)`:`${diff}日前(${pmd}配信) ※古い記事`;
      return `【${i+1}】${item.title.substring(0,40)} → ${rel}`;
    }catch(e){return `【${i+1}】${item.title.substring(0,40)} → 配信日時不明`;}
  }).join('\n');
}

// ── レビュー描画 ──
function renderAiRev(rev){
  if(!rev||rev.ai_score===undefined) return '<div class="st">AI文体チェックデータなし</div>';
  const sc=rev.ai_score||0,ov=rev.overall||'',vc=ov==='クリア'?'v-ok':ov==='軽微な問題あり'?'v-warn':'v-ng';
  const issues=(rev.issues||[]).map(iss=>`<div class="ai-issue"><div style="font-size:11px;font-weight:600;color:var(--ng);margin-bottom:2px">${esc(iss.type||'')} — 「${esc(iss.location||'')}」</div><div style="color:var(--acc);font-size:12px">💡 ${esc(iss.suggestion||'')}</div></div>`).join('');
  return `<div class="rev-panel"><div class="rev-header"><span style="font-size:18px;font-weight:700;color:${sc>=80?'var(--ok)':sc>=60?'var(--warn)':'var(--ng)'}">AI度 ${sc}</span><span style="font-size:11px;color:var(--mut)">/100（低いほど人間らしい）</span><div class="sp"></div><span class="rev-verdict ${vc}">${ov}</span></div>${issues||'<div style="font-size:13px;color:var(--ok)">✅ AI文体の問題は検出されませんでした</div>'}</div>`;
}
function renderAgents(agents){
  if(!agents||!agents.length) return '<div class="st">エージェントレビューなし</div>';
  return agents.map(a=>{
    const sc=a.score||0,vc=a.verdict==='合格'?'v-ok':a.verdict==='要修正'?'v-warn':'v-ng';
    const issues=(a.issues||[]).map(s=>`<div class="rev-item" style="color:var(--ng)">❌ ${esc(s)}</div>`).join('');
    const str=(a.strengths||[]).map(s=>`<div class="rev-item" style="color:var(--ok)">✅ ${esc(s)}</div>`).join('');
    const sug=(a.rewrite_suggestions||[]).map(s=>`<div class="rev-item" style="color:var(--acc)">💡 ${esc(s)}</div>`).join('');
    const scColor=sc>=80?'var(--ok)':sc>=60?'var(--warn)':'var(--ng)';
    return `<div class="rev-panel"><div class="rev-header"><span style="font-size:13px;font-weight:600">${esc(a.agent||'')}</span><span style="font-size:17px;font-weight:700;color:${scColor};margin-left:8px">${sc}</span><span style="font-size:11px;color:var(--mut)">/100</span><div class="sp"></div><span class="rev-verdict ${vc}">${esc(a.verdict||'')}</span></div>${str}${issues}${sug}</div>`;
  }).join('');
}
function renderMag(mag){
  if(!mag||!mag.primary_magazine) return '<div class="st">マガジン推薦データなし</div>';
  const pm=mag.primary_magazine||'market',sm=mag.secondary_magazine;
  const pmI=MAG[pm]||MAG.market,smI=sm?MAG[sm]:null;
  let paid=mag.paid_recommendation?`<div class="paid-rec"><div style="font-size:13px;font-weight:600;color:var(--acc2);margin-bottom:4px">💎 有料記事レコメンド</div><div style="font-size:13px">${esc(mag.paid_reason||'')}</div><div style="font-size:11px;color:var(--acc2);margin-top:4px">推奨: 500〜800円</div></div>`:'';
  return `${paid}<div class="mag-box"><div style="font-size:11px;color:var(--mut);margin-bottom:5px">メインマガジン</div><span class="mtag ${pmI.cls}" style="font-size:13px;padding:3px 10px">${pmI.name}</span><div style="font-size:12px;color:var(--mut);margin-top:5px">${esc(mag.reason||'')}</div></div>${smI?`<div class="mag-box"><div style="font-size:11px;color:var(--mut);margin-bottom:5px">サブマガジン</div><span class="mtag ${smI.cls}">${smI.name}</span></div>`:''}`;
}

// ── アーカイブ ──
function saveArch(r){
  try{
    const a=JSON.parse(localStorage.getItem('hinata_arch')||'[]');
    const exists=a.findIndex(x=>x.generated_at===r.generated_at);
    if(exists>=0) a[exists]=r; else a.unshift(r);
    localStorage.setItem('hinata_arch',JSON.stringify(a.slice(0,50)));
  }catch(e){}
}
function loadArchive(){
  try{archAll=JSON.parse(localStorage.getItem('hinata_arch')||'[]');}catch(e){archAll=[];}
  const el=document.getElementById('archList');
  if(!archAll.length){el.innerHTML='<div class="st">アーカイブはまだありません<br><span style="font-size:11px">記事を生成するとここに保存されます</span></div>';return;}
  el.innerHTML=archAll.map((h,i)=>{
    const mag=h.magazine?.primary_magazine?MAG[h.magazine.primary_magazine]||MAG.market:null;
    const mt=mag?`<span class="mtag ${mag.cls}" style="font-size:10px">${mag.name}</span>`:'';
    const mo=h.mode?`<span class="mode-badge mode-${h.mode}" style="font-size:10px;padding:1px 6px">${ML[h.mode]||h.mode}</span>`:'';
    return `<div class="hitem${activeArchIdx===i?' active':''}" onclick="openArch(${i})">
      <div class="hdate">${h.generated_at||''} ${mo} ${mt}</div>
      <div class="htitle">${esc(h.title||'')}</div>
      <div class="hpreview">${esc((h.note||'').substring(0,60))}...</div>
    </div>`;
  }).join('');
}
function openArch(i){
  const h=archAll[i];if(!h)return;
  activeArchIdx=i;
  loadArchive();
  const wrap=document.getElementById('archDetail');
  wrap.style.display='block';
  const tweets=h.tweets||[];
  const DAYS2=['日','月','火','水','木','金','土'];
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}(${DAYS2[d.getDay()]})`;
  const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
  const d3=new Date(today);d3.setDate(d3.getDate()+3);
  const dates=[`${fmt(today)} 公開時`,`${fmt(today)} 21:00`,`${fmt(tomorrow)} 7:00`,`${fmt(d3)} 21:00`];
  wrap.innerHTML=`<div class="detail-wrap">
    <div class="detail-hd">
      <div style="font-size:11px;color:var(--mut);margin-bottom:3px">${h.generated_at||''}</div>
      <div style="font-size:14px;font-weight:600">${esc(h.title||'')}</div>
    </div>
    <div class="detail-body">
      <div class="otabs" id="arch-otabs">
        <button class="otab on" onclick="otab('adnote',this,'arch-otabs')">📝 note記事</button>
        <button class="otab" onclick="otab('adtweet',this,'arch-otabs')">🐦 X投稿</button>
      </div>
      <div id="op-adnote" class="op on">
        <div class="row" style="margin-bottom:6px">
          <span style="font-size:11px;color:var(--mut)">note記事（全文）</span>
          <div style="display:flex;gap:5px">
            <button class="btn-copy" id="adcpMd" onclick="cpTA('adnoteTA','md','adcpMd')">📋 Md</button>
            <button class="btn-copy" id="adcpPl" onclick="cpTA('adnoteTA','plain','adcpPl')">📄 Plain</button>
          </div>
        </div>
        <textarea id="adnoteTA" rows="12" readonly>${esc(h.note||'')}</textarea>
      </div>
      <div id="op-adtweet" class="op">
        ${tweets.map((tw,ti)=>{
          const chars=calcX(tw.text||'');
          const cc=chars>280?'var(--ng)':chars>240?'var(--warn)':'var(--mut)';
          return `<div class="tweet-card">
            <div class="tweet-header">
              <span class="tweet-label">${esc(tw.label||'')}</span>
              <span style="font-size:11px;color:var(--mut)">🕐 ${dates[ti]||''}</span>
              <span style="font-size:11px;margin-left:auto;color:${cc}">${chars}/280</span>
              <button class="btn-copy" onclick="cpStr(${JSON.stringify(tw.text||'')},this)">📋</button>
            </div>
            <div class="tweet-body">${esc(tw.text||'')}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div style="padding:0 14px 12px">
      <button class="btn" onclick="document.getElementById('archDetail').style.display='none';activeArchIdx=-1;loadArchive()">✕ 閉じる</button>
    </div>
  </div>`;
  wrap.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── イベント ──
const EVENTS=[
  {name:"FOMC政策金利発表",date:"2026-05-08",time_jst:"03:00",org:"FRB",country:"🇺🇸",local_tz:"ET",local_time:"13:00"},
  {name:"FOMC議事要旨",date:"2026-05-28",time_jst:"03:00",org:"FRB",country:"🇺🇸",local_tz:"ET",local_time:"14:00"},
  {name:"日銀金融政策決定会合",date:"2026-04-30",time_jst:"12:00",org:"日銀",country:"🇯🇵",local_tz:"JST",local_time:"12:00"},
  {name:"米雇用統計",date:"2026-05-01",time_jst:"21:30",org:"BLS",country:"🇺🇸",local_tz:"ET",local_time:"08:30"},
  {name:"米CPI",date:"2026-05-13",time_jst:"21:30",org:"BLS",country:"🇺🇸",local_tz:"ET",local_time:"08:30"},
  {name:"GDP速報値（米）",date:"2026-04-30",time_jst:"21:30",org:"BEA",country:"🇺🇸",local_tz:"ET",local_time:"08:30"},
  {name:"ECB政策金利発表",date:"2026-06-05",time_jst:"21:15",org:"ECB",country:"🇪🇺",local_tz:"CET",local_time:"14:15"},
  {name:"米小売売上高",date:"2026-05-15",time_jst:"21:30",org:"Commerce",country:"🇺🇸",local_tz:"ET",local_time:"08:30"},
];
function renderEvents(){
  const today=new Date();today.setHours(0,0,0,0);
  const evs=EVENTS.map(ev=>{
    const d=new Date(ev.date+'T00:00:00+09:00');
    return {...ev,days_left:Math.round((d-today)/(86400000))};
  }).filter(ev=>ev.days_left>=-1&&ev.days_left<=60).sort((a,b)=>a.days_left-b.days_left);
  const el=document.getElementById('eventList');
  if(!evs.length){el.innerHTML='<div class="st">直近60日のイベントなし</div>';return;}
  el.innerHTML=evs.map(ev=>{
    const dl=ev.days_left;
    const cls=dl<=0?'ev-today':dl<=3?'ev-soon':'ev-coming';
    const dcls=dl<=0?'ev-days-today':dl<=3?'ev-days-soon':'ev-days-coming';
    const dtext=dl<0?`${Math.abs(dl)}日前`:dl===0?'本日':dl===1?'明日':`あと${dl}日`;
    const d=new Date(ev.date+'T00:00:00+09:00');
    const dow=DAYS[d.getDay()];
    const tinfo=ev.country==='🇯🇵'?`${ev.time_jst} JST`:`${ev.time_jst} JST / 現地${ev.local_tz} ${ev.local_time}`;
    return `<div class="ev-bar ${cls}">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span>${ev.country}</span><span style="font-weight:600">${ev.name}</span>
        <span class="ev-days ${dcls}">${dtext}</span>
      </div>
      <div style="font-size:11px;color:var(--mut);margin-top:3px">${ev.date}（${dow}） ${tinfo} — ${ev.org}</div>
    </div>`;
  }).join('');
}

// ── コピー ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cpStr(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    if(btn){const o=btn.textContent;btn.textContent='✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},2000);}
  });
}
function cpTA(taId,mode,btnId){
  const ta=document.getElementById(taId),btn=document.getElementById(btnId);
  if(!ta||!btn)return;
  let text=ta.value;
  if(mode==='plain') text=text.replace(/^#{1,6}\s+/gm,'').replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/^[-*]\s+/gm,'・').replace(/^\d+\.\s+/gm,'');
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.textContent;btn.textContent=mode==='md'?'✓Md':'✓Plain';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},2000);
  });
}

// 初期化
loadNews();
renderEvents();
</script>
