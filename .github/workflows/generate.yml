name: Daily RSS Score

on:
  schedule:
    # 毎朝7時 JST = UTC 22:00（前日）
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Run RSS scoring
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_MODE: schedule
        run: python generate.py

      - name: Commit scored_news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scored_news.json
          git diff --staged --quiet || git commit -m "chore: update scored_news $(date +'%Y-%m-%d %H:%M JST')"
          git push
